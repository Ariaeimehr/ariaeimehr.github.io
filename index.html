<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohammad Ariaeimehr - Portfolio</title>
    <meta
      name="description"
      content="A modern, minimal single-page portfolio with dynamic typewriter effect and interactive particle canvas."
    />
    <meta property="og:title" content="Mohammad Ariaeimehr - Portfolio" />
    <meta
      property="og:description"
      content="A modern, minimal single-page portfolio with dynamic typewriter effect and interactive particle canvas."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Reset & Base Styles */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Hide overflow to prevent scrolling */
        font-family: 'Poppins', sans-serif;
        color: #ffffff;
        background-color: #0b0f19;
      }

      /* Fullscreen Background Image with Dark Overlay */
      body {
        position: relative;
        background-image:
          linear-gradient(rgba(11, 15, 25, 0.78), rgba(11, 15, 25, 0.88)),
          url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2070&q=80');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }

      /* Particles.js Canvas Container */
      #particles-js {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* Above background image, behind content */
      }

      /* Top Navbar */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        padding: 0 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        backdrop-filter: blur(4px);
        background: rgba(11, 15, 25, 0.25);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .logo {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #ffffff;
        text-decoration: none;
        transition: opacity 0.3s ease;
      }

      .logo:hover {
        opacity: 0.85;
      }

      .nav-links {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .nav-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 400;
        letter-spacing: 0.3px;
        position: relative;
        padding: 6px 0;
        transition: color 0.3s ease;
      }

      .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background-color: #e74c3c;
        transition: width 0.3s ease;
      }

      .nav-link:hover {
        color: #f1f1f1;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* Mobile Navigation Toggle */
      .mobile-menu-btn {
        display: none;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px;
      }

      .mobile-menu-btn span {
        display: block;
        width: 24px;
        height: 2px;
        background: #ffffff;
        margin: 5px 0;
        transition: 0.3s;
      }

      /* Hero / Center Content */
      .hero-container {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 24px;
        user-select: none;
      }

      .sub-heading {
        font-size: 1.15rem;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #e74c3c;
        margin-bottom: 16px;
        animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .main-heading {
        font-size: clamp(2.2rem, 5vw, 4.25rem);
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 36px;
        max-width: 900px;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .typed-text {
        color: #ffffff;
        border-bottom: 3px solid #e74c3c;
        padding-bottom: 2px;
      }

      .typed-cursor {
        color: #e74c3c;
        font-weight: 300;
      }

      /* Call To Action Buttons */
      .cta-group {
        display: flex;
        align-items: center;
        gap: 20px;
        animation: fadeInUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .btn {
        font-family: 'Poppins', sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        padding: 13px 34px;
        border-radius: 6px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .btn-primary {
        background-color: #e74c3c;
        color: #ffffff;
        border: 2px solid #e74c3c;
        box-shadow: 0 4px 16px rgba(231, 76, 60, 0.35);
      }

      .btn-primary:hover {
        background-color: #cf3a2a;
        border-color: #cf3a2a;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5);
      }

      .btn-outline {
        background-color: transparent;
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.85);
      }

      .btn-outline:hover {
        background-color: #ffffff;
        color: #0b0f19;
        border-color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
      }

      .btn:active {
        transform: translateY(0);
      }

      /* Keyframe animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive rules */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 24px;
          height: 70px;
        }

        .logo {
          font-size: 1.1rem;
        }

        .nav-links {
          display: none;
          position: absolute;
          top: 70px;
          left: 0;
          width: 100%;
          background: rgba(11, 15, 25, 0.95);
          backdrop-filter: blur(12px);
          flex-direction: column;
          padding: 24px 0;
          gap: 20px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-links.active {
          display: flex;
        }

        .mobile-menu-btn {
          display: block;
        }

        .sub-heading {
          font-size: 1rem;
          letter-spacing: 3px;
        }

        .cta-group {
          flex-direction: column;
          width: 100%;
          max-width: 280px;
          gap: 14px;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- Particles Background Canvas -->
    <div id="particles-js"></div>

    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
      <a href="#" class="logo" id="nav-logo">Mohammad Ariaeimehr</a>

      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="nav-menu">
        <li><a href="#" class="nav-link">Home</a></li>
        <li><a href="https://orcid.org/0009-0005-4699-5837" target="_blank" class="nav-link">ORCID</a></li>
        <li><a href="mailto:mizabim@gmail.com" class="nav-link">Contact</a></li>
      </ul>
    </nav>

    <!-- Center Hero Content -->
    <main class="hero-container" id="hero-content">
      <p class="sub-heading" id="welcome-text">Welcome</p>
      <h1 class="main-heading" id="hero-heading">
        I am a <span id="typed" class="typed-text"></span>
      </h1>

      <div class="cta-group" id="cta-actions">
        <a href="https://orcid.org/0009-0005-4699-5837" target="_blank" class="btn btn-primary" id="btn-resume">Resume</a>
        <a href="mailto:mizabim@gmail.com" class="btn btn-outline" id="btn-contact">Contact</a>
      </div>
    </main>

    <!-- CDNs: Particles.js & Typed.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <!-- Interactive Script -->
    <script>
      // 1. Typed.js Initialization
      document.addEventListener('DOMContentLoaded', function () {
        if (window.Typed) {
          new Typed('#typed', {
            strings: [
              'System Engineer.',
              'Researcher in HAR.',
              'Deep Learning Enthusiast.',
              'Federated Learning Explorer.'
            ],
            typeSpeed: 60,
            backSpeed: 35,
            backDelay: 1800,
            loop: true,
            loopCount: Infinity,
            showCursor: true,
            cursorChar: '|'
          });
        }

        // 2. Particles.js Configuration
        if (window.particlesJS) {
          particlesJS('particles-js', {
            particles: {
              number: {
                value: 75,
                density: {
                  enable: true,
                  value_area: 800
                }
              },
              color: {
                value: '#ffffff'
              },
              shape: {
                type: 'circle'
              },
              opacity: {
                value: 0.5,
                random: false
              },
              size: {
                value: 3,
                random: true
              },
              line_linked: {
                enable: true,
                distance: 150,
                color: '#ffffff',
                opacity: 0.35,
                width: 1
              },
              move: {
                enable: true,
                speed: 1.8,
                direction: 'none',
                random: false,
                straight: false,
                out_mode: 'out',
                bounce: false
              }
            },
            interactivity: {
              detect_on: 'canvas',
              events: {
                onhover: {
                  enable: true,
                  mode: 'grab'
                },
                onclick: {
                  enable: true,
                  mode: 'push'
                },
                resize: true
              },
              modes: {
                grab: {
                  distance: 140,
                  line_linked: {
                    opacity: 0.8
                  }
                },
                push: {
                  particles_nb: 3
                }
              }
            },
            retina_detect: true
          });
        }

        // 3. Mobile Menu Toggle
        const menuToggle = document.getElementById('mobile-menu-toggle');
        const navMenu = document.getElementById('nav-menu');
        if (menuToggle && navMenu) {
          menuToggle.appendEventListener?.('click', function () {
            navMenu.classList.toggle('active');
          });
        }
      });
    </script>
  </body>
</html>
